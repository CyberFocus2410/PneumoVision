# PneumoVision Multi-Dataset Label Harmonization Taxonomy
# Explicit mapping between target findings and source dataset annotations

modes:
  binary:
    target_taxonomy:
      - Pneumonia
      - No Finding
    model_outputs:
      - Pneumonia
  multilabel:
    target_taxonomy:
      - Pneumonia
      - Cardiomegaly
      - Pleural Effusion
      - Atelectasis
      - No Finding
    model_outputs:
      - Pneumonia
      - Cardiomegaly
      - Pleural Effusion
      - Atelectasis
      - No Finding

target_taxonomy:
  - Pneumonia
  - No Finding

datasets:
  kaggle_chest_xray:
    Pneumonia: "PNEUMONIA"
    No Finding: "NORMAL"

  nih_chestxray14:
    Pneumonia: "Pneumonia"
    Cardiomegaly: "Cardiomegaly"
    Pleural Effusion: "Effusion"
    Atelectasis: "Atelectasis"
    No Finding: "No Finding"
  
  chexpert:
    Pneumonia: "Pneumonia"
    Cardiomegaly: "Cardiomegaly"
    Pleural Effusion: "Pleural Effusion"
    Atelectasis: "Atelectasis"
    No Finding: "No Finding"
    uncertainty_policy: "u_zeros" # Treat -1 as 0 for robust lower-bound estimation

  mimic_cxr:
    Pneumonia: "Pneumonia"
    Cardiomegaly: "Cardiomegaly"
    Pleural Effusion: "Pleural Effusion"
    Atelectasis: "Atelectasis"
    No Finding: "No Finding"

